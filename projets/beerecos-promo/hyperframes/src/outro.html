<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>BeeRecos · Signature</title>
    <script src="gsap-3.14.2.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 500; src: url("fonts/poppins-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("fonts/poppins-latin-600-normal.woff2") format("woff2"); }
      :root { {{VARS}} }
      html, body { margin: 0; background: #ffffff; }
      body { font-family: "Poppins", sans-serif; color: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      .clip { position: absolute; inset: 0; }
      /* Logo officiel, puis l'adresse ; la signature reste hors de la zone de protection (≈ 1/6 de la largeur du logo). */
      #lockup { position: absolute; left: 0; right: 0; top: var(--lockup-top); display: flex; flex-direction: column; align-items: center; }
      #logo { display: block; width: var(--logo-w); height: auto; }
      #site { display: block; margin-top: var(--site-gap); font-size: var(--site-size); font-weight: 500; color: #000; letter-spacing: 0.01em; }
      #sig { display: block; margin-top: var(--sig-gap); font-family: "Poppins", sans-serif; font-weight: 600; letter-spacing: -0.01em; font-size: var(--sig-size); color: #2851FF; white-space: nowrap; }
      #dot { position: absolute; left: 0; top: 0; width: var(--dot); height: var(--dot); border-radius: 50%; background: #2851FF; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="outro" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
      <section id="scene" class="clip" data-start="0" data-duration="{{DUR}}">
        <div id="lockup">
          <img id="logo" src="brand/beerecos-logo-blue.svg" alt="BeeRecos" />
          <span id="site">{{SITE}}</span>
          <span id="sig">{{HASHTAG}}</span>
        </div>
        <div id="dot"></div>
      </section>
    </div>
    <script>
      const P = {{DOT_PATH}};
      const tl = gsap.timeline({ paused: true });
      // Le repère bleu arrive de la scène 8 et se fond dans la signature.
      tl.fromTo("#dot", { x: P.x, y: P.y, scale: 1, opacity: 1 }, { x: P.tx, y: P.ty, scale: 0.4, opacity: 0, duration: 0.6, ease: "power3.inOut" }, 0);
      // Logo complet : entrée sobre (fondu + légère échelle), dessin intact.
      tl.fromTo("#logo", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 0.25);
      tl.fromTo("#site", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9);
      // Signature (Poppins, bleu #2851FF) révélée par un masque d'écriture, de gauche à droite.
      tl.fromTo("#sig", { clipPath: "inset(-20% 100% -20% 0%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: 1.3, ease: "power1.inOut" }, 1.35);
      // Tout est stable à partir de 2,65 s : 3,35 s de lecture (les 2 dernières secondes sont fixes).
      window.__timelines["outro"] = tl;
    </script>
  </body>
</html>
