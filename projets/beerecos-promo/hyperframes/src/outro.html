<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>BeeRecos · Signature</title>
    <script src="gsap-3.14.2.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 400; src: url("fonts/poppins-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("fonts/poppins-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Caveat"; font-weight: 700; src: url("fonts/caveat-latin-700-normal.woff2") format("woff2"); }
      :root { {{VARS}} }
      html, body { margin: 0; background: #ffffff; }
      body { font-family: "Poppins", sans-serif; color: var(--black); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      .clip { position: absolute; inset: 0; }
      #lockup { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap); }
      #logo { display: block; width: var(--logo-w); height: auto; }
      #tagline { font-size: var(--tag-size); font-weight: 400; color: var(--grey); margin: 0; }
      #cta { display: block; background: var(--blue); color: #fff; font-size: var(--cta-size); font-weight: 600;
             padding: 0.55em 1.3em; border-radius: 999px; }
      #url { display: block; font-size: var(--tag-size); font-weight: 600; color: var(--black); margin-top: -0.4em; }
      #hashtag { display: block; font-family: "Caveat", cursive; font-weight: 700; font-size: var(--hash-size); color: var(--blue); }
      #dot { position: absolute; left: 0; top: 0; width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--blue); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="outro" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
      <section id="scene" class="clip" data-start="0" data-duration="{{DUR}}">
        <div id="lockup">
          <img id="logo" src="brand/beerecos-logo-blue.svg" alt="BeeRecos" />
          <p id="tagline">{{TAGLINE}}</p>
          <span id="cta">{{CTA}}</span>
          <span id="url">{{CTA_URL}}</span>
          <span id="hashtag">{{HASHTAG}}</span>
        </div>
        <div id="dot"></div>
      </section>
    </div>
    <script>
      const P = {{DOT}};
      const tl = gsap.timeline({ paused: true });
      // Le repère bleu arrive de la scène précédente et se fond dans la signature.
      tl.fromTo("#dot", { x: P.x, y: P.y, scale: 1, opacity: 1 }, { x: P.cx, y: P.cy, scale: 0.4, opacity: 0, duration: 0.55, ease: "power3.inOut" }, 0);
      // Charte : seul le fondu anime le logo (ni échelle, ni rotation).
      tl.fromTo("#logo", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.3);
      tl.fromTo("#tagline", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.95);
      tl.fromTo("#cta", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.4);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.6);
      tl.fromTo("#hashtag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.85);
      // Tout est stable à partir de 2,35 s : 2,65 s de lecture pour le logo et le CTA.
      window.__timelines["outro"] = tl;
    </script>
  </body>
</html>
