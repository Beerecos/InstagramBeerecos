<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>BeeRecos · La rencontre</title>
    <script src="gsap-3.14.2.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 400; src: url("fonts/poppins-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 500; src: url("fonts/poppins-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("fonts/poppins-latin-600-normal.woff2") format("woff2"); }
      :root { {{VARS}} }
      html, body { margin: 0; background: #ffffff; }
      body { font-family: "Poppins", sans-serif; color: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      .clip { position: absolute; inset: 0; }

      /* Accroche : « Tout commence / par une rencontre. » — Poppins Regular, mot clé en bleu. */
      #title { position: absolute; left: var(--title-x); top: var(--title-y); width: var(--title-w); height: var(--title-h);
               display: flex; flex-direction: column; justify-content: flex-end; }
      .line { display: block; font-size: var(--title-size); font-weight: 400; line-height: 1.1; letter-spacing: -0.02em; }
      #w-rencontre { display: inline-block; color: #000; }

      /* Fenêtre photo (masque arrondi, charte BeeRecos). */
      #window { position: absolute; left: var(--v-x); top: var(--v-y); width: var(--v-w); height: var(--v-h);
                border-radius: 36px; overflow: hidden; background: #0b1020; }
      #push { position: absolute; inset: 0; transform-origin: var(--focus-x) var(--focus-y); }
      #clipvid { position: absolute; left: var(--img-x); top: var(--img-y); width: var(--img-w); height: var(--img-h); object-fit: cover; }
      #tag { position: absolute; left: 22px; bottom: 18px; font-size: 22px; font-weight: 500; color: rgba(255,255,255,0.85); }
      #thread { position: absolute; left: var(--v-x); top: var(--v-y); width: var(--v-w); height: var(--v-h); overflow: visible; }
      #dot { position: absolute; left: 0; top: 0; width: var(--dot); height: var(--dot); border-radius: 50%; background: #2851FF;
             box-shadow: 0 0 0 6px rgba(255,255,255,0.9); }
      #ring { position: absolute; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; border: 4px solid #2851FF; box-sizing: border-box; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
      <div id="window">
        <div id="push"><video id="clipvid" src="media/rencontre.mp4" muted playsinline data-start="0" data-duration="{{DUR}}" data-media-start="{{MEDIA_START}}"></video></div>
        <span id="tag" data-layout-ignore>Image d'illustration</span>
      </div>
      <section id="scene" class="clip" data-start="0" data-duration="{{DUR}}">
        <div id="title">
          <span class="line" id="l1">Tout commence</span>
          <span class="line" id="l2">par une <span id="w-rencontre">rencontre.</span></span>
        </div>
        <svg id="thread" viewBox="0 0 {{VW}} {{VH}}">
          <line id="link" x1="{{AX}}" y1="{{AY}}" x2="{{BX}}" y2="{{BY}}" stroke="#2851FF" stroke-width="8" stroke-linecap="round" stroke-dasharray="{{LINK_LEN}}" stroke-dashoffset="{{LINK_LEN}}" />
        </svg>
        <div id="ring"></div>
        <div id="dot"></div>
      </section>
    </div>
    <script>
      // Temps calés sur la voix : « rencontre » est prononcé à {{T_RENCONTRE}} s.
      const P = {{POINTS}};
      const D = {{DOT}};
      const tl = gsap.timeline({ paused: true });
      // Accroche lisible dès la première image.
      tl.fromTo("#l1", { y: 10 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#window", { opacity: 0.85, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#push", { scale: 1.06 }, { scale: 1, duration: 4, ease: "none" }, 0);
      tl.fromTo("#l2", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.7);
      // Le trait bleu naît entre les deux personnes : il devient le fil conducteur du film.
      tl.fromTo("#dot", { x: P.cx - D / 2, y: P.cy - D / 2, scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.1);
      tl.to("#link", { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 2.25);
      tl.fromTo("#link", { x: 0 }, { x: P.drift, duration: 1.4, ease: "none" }, 2.1);
      tl.to("#dot", { x: P.cx - D / 2 + P.drift, duration: 1.4, ease: "none" }, 2.1);
      tl.to("#w-rencontre", { color: "#2851FF", duration: 0.15 }, {{T_RENCONTRE}});
      tl.fromTo("#ring", { x: P.cx - 60, y: P.cy - 60, scale: 0.3, opacity: 1 }, { scale: 1.4, opacity: 0, duration: 0.6, ease: "power2.out" }, {{T_RENCONTRE}});
      // Sortie : la photo s'efface, le repère rejoint le centre de la zone visuelle (raccord avec la scène 2).
      tl.to(["#window", "#link"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.45);
      tl.to("#title", { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" }, 3.55);
      tl.to("#dot", { x: P.ex - D / 2, y: P.ey - D / 2, duration: 0.45, ease: "power3.inOut" }, 3.5);
      window.__timelines["intro"] = tl;
    </script>
  </body>
</html>
