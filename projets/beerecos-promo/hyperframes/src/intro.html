<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>BeeRecos · Accroche</title>
    <script src="gsap-3.14.2.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 400; src: url("fonts/poppins-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 500; src: url("fonts/poppins-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("fonts/poppins-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("fonts/poppins-latin-700-normal.woff2") format("woff2"); }
      :root { {{VARS}} }
      html, body { margin: 0; background: #ffffff; }
      body { font-family: "Poppins", sans-serif; color: var(--black); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      .clip { position: absolute; inset: 0; }

      /* Accroche : trois phrases, la dernière en bleu. */
      #words { position: absolute; left: var(--title-x); top: var(--title-y); width: var(--title-w); }
      .word { display: block; font-size: var(--title-size); line-height: 1.12; font-weight: 600; letter-spacing: -0.02em; }
      .word.accent { color: var(--blue); }

      /* Scène logique 900×900, mise à l'échelle par format (identique aux scènes Remotion). */
      #stage { position: absolute; left: var(--stage-x); top: var(--stage-y); width: 900px; height: 900px;
               transform-origin: 0 0; transform: scale(var(--stage-scale)); }
      .card { position: absolute; background: #fff; border: 1.5px solid var(--line); border-radius: 28px;
              box-shadow: 0 18px 50px rgba(11, 21, 51, 0.08); box-sizing: border-box; }
      .label { font-size: 22px; font-weight: 500; color: var(--grey); }
      .strong { font-size: 30px; font-weight: 600; color: var(--black); }
      #you { left: 260px; top: 370px; width: 380px; height: 160px; padding: 28px 34px; }
      #you .label { font-size: 28px; } #you .strong { font-size: 40px; }
      .node { position: absolute; width: 110px; height: 110px; border-radius: 55px; background: #fff; border: 3px solid var(--blue);
              box-sizing: border-box; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(40,81,255,0.15); }
      .node svg { width: 50px; height: 50px; }
      #links { position: absolute; inset: 0; width: 900px; height: 900px; overflow: visible; }
      #dot { position: absolute; left: 0; top: 0; width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--blue); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
      <section id="scene" class="clip" data-start="0" data-duration="{{DUR}}">
        <div id="words">
          <span class="word" id="w1">Vous prospectez seul&nbsp;?</span>
          <span class="word accent" id="w2">Faites-vous recommander.</span>
        </div>
        <div id="stage">
          <svg id="links" viewBox="0 0 900 900">
            <line class="ln" x1="450" y1="450" x2="450" y2="120" stroke="#2851FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" />
            <line class="ln" x1="450" y1="450" x2="736" y2="285" stroke="#2851FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" />
            <line class="ln" x1="450" y1="450" x2="736" y2="615" stroke="#2851FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" />
            <line class="ln" x1="450" y1="450" x2="450" y2="780" stroke="#2851FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" />
            <line class="ln" x1="450" y1="450" x2="164" y2="615" stroke="#2851FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" />
            <line class="ln" x1="450" y1="450" x2="164" y2="285" stroke="#2851FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" />
          </svg>
          <div class="node" id="n0" style="left:395px;top:65px"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="5" fill="none" stroke="#2851FF" stroke-width="2.4"/><path d="M6 27 C6 20 10 18 16 18 C22 18 26 20 26 27" fill="none" stroke="#2851FF" stroke-width="2.4" stroke-linecap="round"/></svg></div>
          <div class="node" id="n1" style="left:681px;top:230px"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="5" fill="none" stroke="#2851FF" stroke-width="2.4"/><path d="M6 27 C6 20 10 18 16 18 C22 18 26 20 26 27" fill="none" stroke="#2851FF" stroke-width="2.4" stroke-linecap="round"/></svg></div>
          <div class="node" id="n2" style="left:681px;top:560px"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="5" fill="none" stroke="#2851FF" stroke-width="2.4"/><path d="M6 27 C6 20 10 18 16 18 C22 18 26 20 26 27" fill="none" stroke="#2851FF" stroke-width="2.4" stroke-linecap="round"/></svg></div>
          <div class="node" id="n3" style="left:395px;top:725px"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="5" fill="none" stroke="#2851FF" stroke-width="2.4"/><path d="M6 27 C6 20 10 18 16 18 C22 18 26 20 26 27" fill="none" stroke="#2851FF" stroke-width="2.4" stroke-linecap="round"/></svg></div>
          <div class="node" id="n4" style="left:109px;top:560px"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="5" fill="none" stroke="#2851FF" stroke-width="2.4"/><path d="M6 27 C6 20 10 18 16 18 C22 18 26 20 26 27" fill="none" stroke="#2851FF" stroke-width="2.4" stroke-linecap="round"/></svg></div>
          <div class="node" id="n5" style="left:109px;top:230px"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="5" fill="none" stroke="#2851FF" stroke-width="2.4"/><path d="M6 27 C6 20 10 18 16 18 C22 18 26 20 26 27" fill="none" stroke="#2851FF" stroke-width="2.4" stroke-linecap="round"/></svg></div>
          <div class="card" id="you">
            <div class="label">Prospection</div><div class="strong">Vous, seul</div>
          </div>
          <div id="dot"></div>
        </div>
      </section>
    </div>
    <script>
      // Temps calés sur la voix réellement générée (config/promo.json → captions).
      const T = {{TIMES}};
      const D = {{DOT}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#w1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#you", { y: 40, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#w2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, T[1]);
      // Le réseau se forme autour de la carte : six membres, six liens de recommandation.
      tl.fromTo(".node", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", stagger: 0.08 }, T[1] + 0.1);
      tl.to(".ln", { strokeDashoffset: 55, duration: 0.6, ease: "power2.inOut", stagger: 0.08 }, T[1] + 0.3);
      tl.fromTo("#dot", { x: 450 - D / 2, y: 450 - D / 2, scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.6);
      tl.to("#you .strong", { color: "#2851FF", duration: 0.2 }, 2.6);
      tl.to(["#you", ".node", "#links"], { opacity: 0, scale: 0.97, duration: 0.4, ease: "power2.in", stagger: 0.02 }, 3.3);
      tl.to("#words", { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, 3.4);
      window.__timelines["intro"] = tl;
    </script>
  </body>
</html>
